name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test and package
        run: sh scripts/ci.sh
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ github.sha }}
          path: dist/app.tgz
          if-no-files-found: error
